<title>Parallax Landscape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat&display=swap">
<style>
  :root {
    --paper: #ebe5da;
    --ink-dark: #1d1a16;
    --ink-mid: #4a4238;
    --ink-light: #7d7265;
    --ink-wash: #b8ad9e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15120f;
      --ink-dark: #ddd5c8;
      --ink-mid: #9e9487;
      --ink-light: #5a5248;
      --ink-wash: #2e2a25;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15120f;
    --ink-dark: #ddd5c8;
    --ink-mid: #9e9487;
    --ink-light: #5a5248;
    --ink-wash: #2e2a25;
  }
  body {
    margin: 0;
    background: var(--paper);
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  body.dragging { cursor: grabbing; }
  #viewport {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform;
    transform-origin: 0 0;
  }
  #bg { z-index: 1; }
  #mg { z-index: 2; }
  #fg { z-index: 3; }
  .hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Caveat', 'Segoe Print', cursive;
    font-size: 22px;
    color: var(--ink-light);
    opacity: 1;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .hint.faded { opacity: 0; }
  .zoom-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: 'Caveat', 'Segoe Print', cursive;
    font-size: 18px;
    color: var(--ink-wash);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .zoom-badge.on { opacity: 1; }
  #viewport::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.05);
  }
</style>

<div id="viewport">
  <canvas id="bg"></canvas>
  <canvas id="mg"></canvas>
  <canvas id="fg"></canvas>
  <div class="hint" id="hint">drag to pan &#183; scroll to zoom</div>
  <div class="zoom-badge" id="zbadge"></div>
</div>

<script>
(function () {
  'use strict';

  /* ── config ── */
  var SX = { bg: 0.1, mg: 0.35, fg: 1.0 };
  var SY = { bg: 0.05, mg: 0.2, fg: 0.6 };
  var ZR = { bg: 0.3, mg: 0.6, fg: 1.0 };
  var WORLD = 3.2;
  var FRICTION = 0.93;
  var LERP = 0.12;
  var MINZ = 0.7, MAXZ = 3.0;

  /* ── elements ── */
  var bgC = document.getElementById('bg');
  var mgC = document.getElementById('mg');
  var fgC = document.getElementById('fg');
  var hint = document.getElementById('hint');
  var zbadge = document.getElementById('zbadge');
  var vp = document.getElementById('viewport');
  var canvases = { bg: bgC, mg: mgC, fg: fgC };

  /* ── state ── */
  var vpW, vpH, maxPanX;
  var panX = 0, panY = 0, zoom = 1;
  var tgtX = 0, tgtY = 0, tgtZ = 1;
  var velX = 0, velY = 0;
  var dragging = false, pinching = false;
  var lastX = 0, lastY = 0, lastT = 0;
  var hintShown = true;
  var ptrs = new Map();
  var pinchDist = 0, pinchMid = { x: 0, y: 0 };
  var zoomFadeTimer = 0;

  /* ── seeded PRNG ── */
  var _s = 0;
  function srand(v) { _s = v | 0; }
  function rand() {
    _s = (_s * 16807) % 2147483647;
    return (_s - 1) / 2147483646;
  }

  /* ── spatial noise (position-dependent) ── */
  function frac(x) { return x - Math.floor(x); }
  function noise(x) {
    var xi = Math.floor(x), xf = x - xi;
    var t = xf * xf * (3 - 2 * xf);
    var a = frac(Math.sin(xi * 127.1) * 43758.5453);
    var b = frac(Math.sin((xi + 1) * 127.1) * 43758.5453);
    return a + (b - a) * t;
  }
  function fbm(x, oct) {
    var v = 0, amp = 1, freq = 1, sum = 0;
    for (var i = 0; i < oct; i++) {
      v += noise(x * freq) * amp; sum += amp;
      amp *= 0.5; freq *= 2.1;
    }
    return v / sum;
  }

  /* ── colors from CSS tokens ── */
  function getColors() {
    var s = getComputedStyle(document.documentElement);
    var g = function (k) { return s.getPropertyValue(k).trim(); };
    return { paper: g('--paper'), dark: g('--ink-dark'), mid: g('--ink-mid'),
             light: g('--ink-light'), wash: g('--ink-wash') };
  }
  function hexRGBA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  /* ── drawing primitives ── */
  function wLine(ctx, x1, y1, x2, y2, w) {
    w = w || 1.5;
    var d = Math.hypot(x2 - x1, y2 - y1);
    var segs = Math.max(Math.floor(d / 6), 3);
    ctx.beginPath();
    ctx.moveTo(x1 + (rand() - 0.5) * w, y1 + (rand() - 0.5) * w);
    for (var i = 1; i <= segs; i++) {
      var t = i / segs;
      ctx.lineTo(x1 + (x2 - x1) * t + (rand() - 0.5) * w,
                 y1 + (y2 - y1) * t + (rand() - 0.5) * w);
    }
    ctx.stroke();
  }
  function wPath(ctx, pts, w) {
    if (pts.length < 2) return;
    w = w || 1.5;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] + (rand() - 0.5) * w, pts[0][1] + (rand() - 0.5) * w);
    for (var i = 1; i < pts.length; i++)
      ctx.lineTo(pts[i][0] + (rand() - 0.5) * w, pts[i][1] + (rand() - 0.5) * w);
    ctx.stroke();
  }
  function scribOval(ctx, cx, cy, rx, ry) {
    var n = 14 + Math.floor(rand() * 6);
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2;
      var px = cx + Math.cos(a) * rx * (0.8 + rand() * 0.4) + (rand() - 0.5) * 2;
      var py = cy + Math.sin(a) * ry * (0.8 + rand() * 0.4) + (rand() - 0.5) * 2;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }

  /* ── terrain helpers ── */
  function mgTerrY(x, h) {
    return h * 0.6 + Math.sin(x * 0.008) * h * 0.025 +
      Math.sin(x * 0.003) * h * 0.015 + (fbm(x * 0.005 + 10, 2) - 0.5) * h * 0.02;
  }
  function fgTerrY(x, h) {
    return h * 0.78 + Math.sin(x * 0.012) * h * 0.02 +
      Math.sin(x * 0.004) * h * 0.01 + (fbm(x * 0.008 + 30, 3) - 0.5) * h * 0.025;
  }

  function makeTerrain(fn, w, h, step) {
    var pts = [];
    srand(_s);
    for (var x = -5; x <= w + 5; x += step) {
      var y = fn(x, h) + (rand() - 0.5) * 1.5;
      pts.push([x, y]);
    }
    return pts;
  }
  function fillBelow(ctx, pts, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineTo(w + 10, h + 10);
    ctx.lineTo(-10, h + 10);
    ctx.closePath();
    ctx.fill();
  }
  function strokeTerrain(ctx, pts, color, lw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  /* ── landscape elements ── */
  function drawMountainRidge(ctx, w, h, baseY, peaks, amp) {
    var pts = [];
    for (var x = -10; x <= w + 10; x += 3) {
      var y = baseY;
      for (var j = 0; j < peaks.length; j++) {
        var p = peaks[j];
        var dx = (x - p.x * w) / (w * p.w);
        y -= Math.exp(-dx * dx) * amp * p.h;
      }
      y += (fbm(x * 0.02 + 50, 3) - 0.5) * amp * 0.08;
      pts.push([x, y]);
    }
    wPath(ctx, pts, 1.0);
  }

  function drawConifer(ctx, x, y, h) {
    var tw = h * 0.35;
    wLine(ctx, x, y, x, y - h * 0.25, 1);
    for (var i = 0; i < 3; i++) {
      var ty = y - h * (0.2 + i * 0.28);
      var s = tw * (1 - i * 0.2);
      wPath(ctx, [[x - s, ty + h * 0.18], [x + (rand() - 0.5) * 2, ty], [x + s, ty + h * 0.18]], 1.2);
    }
  }
  function drawDecid(ctx, x, y, h) {
    wLine(ctx, x, y, x + (rand() - 0.5) * 3, y - h * 0.4, 1.5);
    var cy = y - h * 0.65, r = h * 0.3;
    for (var i = 0; i < 2; i++)
      scribOval(ctx, x + (rand() - 0.5) * r * 0.5, cy + (rand() - 0.5) * r * 0.3,
        r * (0.7 + rand() * 0.4), r * (0.6 + rand() * 0.3));
  }
  function drawBuilding(ctx, x, y, bw, bh) {
    wPath(ctx, [[x, y], [x, y - bh], [x + bw, y - bh], [x + bw, y]], 1.2);
    wLine(ctx, x, y, x + bw, y, 1.2);
    wPath(ctx, [[x - bw * 0.08, y - bh],
      [x + bw * 0.5 + (rand() - 0.5) * 2, y - bh - bh * 0.4],
      [x + bw * 1.08, y - bh]], 1.2);
    if (bw > 12) {
      var wx = x + bw * 0.35, wy = y - bh * 0.5, ww = bw * 0.25, wh = bh * 0.25;
      wLine(ctx, wx, wy, wx + ww, wy, 1);
      wLine(ctx, wx, wy + wh, wx + ww, wy + wh, 1);
      wLine(ctx, wx, wy, wx, wy + wh, 1);
      wLine(ctx, wx + ww, wy, wx + ww, wy + wh, 1);
    }
  }
  function drawPole(ctx, x, y, h) {
    wLine(ctx, x, y, x + (rand() - 0.5), y - h, 1);
    wLine(ctx, x - h * 0.15, y - h * 0.92, x + h * 0.15, y - h * 0.92, 1);
    var pts = [];
    var wl = 40 + rand() * 30;
    for (var i = 0; i <= 8; i++) {
      var t = i / 8;
      pts.push([x + h * 0.15 + wl * t, y - h * 0.92 + Math.sin(t * Math.PI) * 4]);
    }
    wPath(ctx, pts, 0.5);
  }
  function drawBush(ctx, x, y, bw, bh) {
    var n = 2 + Math.floor(rand() * 3);
    for (var i = 0; i < n; i++)
      scribOval(ctx, x + (rand() - 0.5) * bw * 0.5, y - bh * (0.3 + rand() * 0.4),
        bw * (0.25 + rand() * 0.2), bh * (0.2 + rand() * 0.15));
  }
  function drawFlower(ctx, x, y, h) {
    var topX = x + (rand() - 0.5) * 6, topY = y - h;
    ctx.beginPath();
    ctx.moveTo(x + (rand() - 0.5), y);
    ctx.quadraticCurveTo(x + (rand() - 0.5) * 8, y - h * 0.5, topX, topY);
    ctx.stroke();
    var type = rand();
    if (type < 0.35) {
      var r = 2 + rand() * 3;
      ctx.beginPath(); ctx.arc(topX, topY, r, 0, Math.PI * 2); ctx.stroke();
    } else if (type < 0.65) {
      var n = 4 + Math.floor(rand() * 3), pr = 3 + rand() * 3;
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2 + rand() * 0.3;
        wLine(ctx, topX, topY, topX + Math.cos(a) * pr, topY + Math.sin(a) * pr, 0.8);
      }
    } else {
      ctx.beginPath(); ctx.arc(topX, topY, 1.5 + rand(), 0, Math.PI * 2); ctx.fill();
    }
    if (rand() > 0.5 && h > 20) {
      var ly = y - h * (0.3 + rand() * 0.3), side = rand() > 0.5 ? 1 : -1;
      var lx = x + (rand() - 0.5) * 3, lt = lx + side * (5 + rand() * 6);
      ctx.beginPath(); ctx.moveTo(lx, ly);
      ctx.quadraticCurveTo(lx + side * 3, ly - 3 - rand() * 3, lt, ly + 1);
      ctx.quadraticCurveTo(lx + side * 3, ly + 3, lx, ly);
      ctx.stroke();
    }
  }
  function drawLeafCluster(ctx, x, y) {
    var n = 3 + Math.floor(rand() * 4);
    for (var i = 0; i < n; i++) {
      var sl = 12 + rand() * 20, ang = -Math.PI / 2 + (rand() - 0.5);
      var tx = x + Math.cos(ang) * sl + (rand() - 0.5) * 5;
      var ty = y + Math.sin(ang) * sl;
      ctx.beginPath(); ctx.moveTo(x + (rand() - 0.5) * 2, y);
      ctx.quadraticCurveTo((x + tx) / 2 + (rand() - 0.5) * 4, (y + ty) / 2, tx, ty);
      ctx.stroke();
      var ll = 6 + rand() * 8, la = ang + (rand() - 0.5) * 0.4;
      var ltx = tx + Math.cos(la) * ll, lty = ty + Math.sin(la) * ll;
      var perp = la + Math.PI / 2, bulge = ll * 0.3;
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo((tx + ltx) / 2 + Math.cos(perp) * bulge,
        (ty + lty) / 2 + Math.sin(perp) * bulge, ltx, lty);
      ctx.quadraticCurveTo((tx + ltx) / 2 - Math.cos(perp) * bulge,
        (ty + lty) / 2 - Math.sin(perp) * bulge, tx, ty);
      ctx.stroke();
    }
  }
  function drawGrass(ctx, x, y, h) {
    var lean = (rand() - 0.5) * 8;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + lean * 0.5, y - h * 0.5, x + lean, y - h);
    ctx.stroke();
  }

  /* ── layer renderers ── */
  function renderBG(ctx, w, h, c) {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = c.light; ctx.fillStyle = c.light;
    ctx.lineWidth = 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    srand(100);
    drawMountainRidge(ctx, w, h, h * 0.38, [
      { x: 0.12, h: 0.6, w: 0.06 }, { x: 0.30, h: 1.0, w: 0.05 },
      { x: 0.42, h: 0.5, w: 0.04 }, { x: 0.55, h: 0.75, w: 0.06 },
      { x: 0.72, h: 0.45, w: 0.05 }, { x: 0.88, h: 0.55, w: 0.05 }
    ], h * 0.22);
    ctx.lineWidth = 0.8;
    drawMountainRidge(ctx, w, h, h * 0.42, [
      { x: 0.05, h: 0.3, w: 0.08 }, { x: 0.25, h: 0.5, w: 0.07 },
      { x: 0.45, h: 0.35, w: 0.1 }, { x: 0.65, h: 0.45, w: 0.08 },
      { x: 0.85, h: 0.3, w: 0.09 }
    ], h * 0.1);
    ctx.strokeStyle = c.wash; ctx.lineWidth = 0.7;
    var hillPts = [];
    for (var x = -5; x <= w + 5; x += 3) {
      var y = h * 0.48 + Math.sin(x * 0.006) * h * 0.03 +
        Math.sin(x * 0.015) * h * 0.015 + (fbm(x * 0.01, 2) - 0.5) * h * 0.02;
      hillPts.push([x, y]);
    }
    wPath(ctx, hillPts, 0.6);
    srand(200);
    ctx.strokeStyle = c.wash; ctx.lineWidth = 0.5;
    for (var x = 0; x < w; x += 6 + rand() * 12) {
      var by = h * 0.48 + Math.sin(x * 0.006) * h * 0.03 + Math.sin(x * 0.015) * h * 0.015;
      var tH = 4 + rand() * 7;
      ctx.beginPath();
      ctx.moveTo(x, by); ctx.lineTo(x - 1.5 - rand(), by - tH);
      ctx.moveTo(x, by); ctx.lineTo(x + 1.5 + rand(), by - tH * 0.6);
      ctx.stroke();
    }
    var grad = ctx.createLinearGradient(0, h * 0.35, 0, h * 0.55);
    grad.addColorStop(0, hexRGBA(c.paper, 0));
    grad.addColorStop(1, hexRGBA(c.paper, 0.35));
    ctx.fillStyle = grad;
    ctx.fillRect(0, h * 0.35, w, h * 0.2);
  }

  function renderMG(ctx, w, h, c) {
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    srand(300);
    var terr = makeTerrain(mgTerrY, w, h, 3);
    fillBelow(ctx, terr, w, h, c.paper);
    strokeTerrain(ctx, terr, c.mid, 1.3);

    ctx.strokeStyle = c.wash; ctx.lineWidth = 0.6; srand(350);
    var zones = [{ a: w * 0.15, b: w * 0.35 }, { a: w * 0.55, b: w * 0.75 }];
    for (var zi = 0; zi < zones.length; zi++) {
      var z = zones[zi];
      for (var y = h * 0.62; y < h * 0.72; y += 4 + rand() * 3) {
        var pts = [];
        for (var x = z.a; x < z.b; x += 8)
          pts.push([x + (rand() - 0.5) * 2, y + Math.sin(x * 0.02) * 2 + (rand() - 0.5)]);
        if (pts.length > 1) wPath(ctx, pts, 0.5);
      }
    }

    ctx.strokeStyle = c.mid; ctx.lineWidth = 1.2; srand(400);
    var clusters = [
      { a: w * 0.02, b: w * 0.12, d: 0.7 },
      { a: w * 0.38, b: w * 0.48, d: 0.5 },
      { a: w * 0.78, b: w * 0.95, d: 0.6 }
    ];
    for (var ci = 0; ci < clusters.length; ci++) {
      var cl = clusters[ci];
      var nt = Math.floor((cl.b - cl.a) / 18 * cl.d);
      for (var i = 0; i < nt; i++) {
        var x = cl.a + rand() * (cl.b - cl.a);
        var by = mgTerrY(x, h);
        var th = 20 + rand() * 25;
        rand() > 0.4 ? drawDecid(ctx, x, by, th) : drawConifer(ctx, x, by, th);
      }
    }
    srand(450);
    for (var i = 0; i < Math.floor(w / 120); i++) {
      var x = rand() * w, by = mgTerrY(x, h), th = 15 + rand() * 20;
      rand() > 0.5 ? drawDecid(ctx, x, by, th) : drawConifer(ctx, x, by, th);
    }

    ctx.strokeStyle = c.mid; ctx.lineWidth = 1.3; srand(500);
    var vx = w * 0.22, vex = w * 0.38;
    var nb = 5 + Math.floor(rand() * 3);
    for (var i = 0; i < nb; i++) {
      var x = vx + rand() * (vex - vx), by = mgTerrY(x, h);
      drawBuilding(ctx, x, by, 10 + rand() * 12, 12 + rand() * 10);
    }
    var v2 = w * 0.62;
    for (var i = 0; i < 3; i++) {
      var x = v2 + rand() * w * 0.08, by = mgTerrY(x, h);
      drawBuilding(ctx, x, by, 8 + rand() * 10, 10 + rand() * 8);
    }

    ctx.strokeStyle = c.mid; ctx.lineWidth = 1; srand(550);
    var r1 = [], r2 = [];
    for (var x = w * 0.1; x < w * 0.75; x += 5) {
      var by = h * 0.66 + Math.sin(x * 0.005) * h * 0.02;
      r1.push([x, by - 3]); r2.push([x, by + 3]);
    }
    wPath(ctx, r1, 0.8); wPath(ctx, r2, 0.8);

    ctx.lineWidth = 0.9; srand(600);
    for (var x = w * 0.15; x < w * 0.7; x += 50 + rand() * 30) {
      var by = h * 0.66 + Math.sin(x * 0.005) * h * 0.02;
      drawPole(ctx, x, by, 22 + rand() * 8);
    }

    ctx.lineWidth = 0.7; srand(650);
    var fy = h * 0.67;
    for (var x = w * 0.5; x < w * 0.78; x += 10 + rand() * 5)
      wLine(ctx, x, fy, x, fy - 6 - rand() * 3, 0.8);
    var fp = [];
    for (var x = w * 0.5; x < w * 0.78; x += 3)
      fp.push([x, fy - 4 + (rand() - 0.5)]);
    if (fp.length > 1) wPath(ctx, fp, 0.4);
  }

  function renderFG(ctx, w, h, c) {
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    srand(700);
    var terr = makeTerrain(fgTerrY, w, h, 3);
    fillBelow(ctx, terr, w, h, c.paper);

    ctx.strokeStyle = c.wash; ctx.lineWidth = 0.5; srand(720);
    for (var i = 0; i < Math.floor(w / 25); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      var len = 8 + rand() * 15;
      wLine(ctx, x, by + 2 + rand() * 4, x + len, by + 2 + rand() * 4, 0.5);
    }

    strokeTerrain(ctx, terr, c.dark, 1.8);

    ctx.strokeStyle = c.dark; ctx.fillStyle = c.dark;
    ctx.lineWidth = 1.5; srand(750);
    for (var i = 0; i < Math.floor(w / 100); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawBush(ctx, x, by, 25 + rand() * 30, 20 + rand() * 25);
    }

    ctx.lineWidth = 1.3; srand(800);
    for (var i = 0; i < Math.floor(w / 60); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawLeafCluster(ctx, x, by);
    }

    ctx.lineWidth = 1.2; srand(850);
    for (var i = 0; i < Math.floor(w / 22); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawFlower(ctx, x, by, 20 + rand() * 40);
    }

    ctx.lineWidth = 0.8; srand(900);
    for (var i = 0; i < Math.floor(w / 10); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawGrass(ctx, x, by, 10 + rand() * 25);
    }
  }

  /* ── canvas setup ── */
  function setupCanvas(canvas, lw, lh) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = lw * dpr;
    canvas.height = lh * dpr;
    canvas.style.width = lw + 'px';
    canvas.style.height = lh + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return ctx;
  }

  function build() {
    vpW = window.innerWidth;
    vpH = window.innerHeight;
    maxPanX = vpW * (WORLD - 1);
    var c = getColors();
    var bgW = Math.ceil(vpW + maxPanX * SX.bg);
    var mgW = Math.ceil(vpW + maxPanX * SX.mg);
    var fgW = Math.ceil(vpW + maxPanX * SX.fg);
    renderBG(setupCanvas(bgC, bgW, vpH), bgW, vpH, c);
    renderMG(setupCanvas(mgC, mgW, vpH), mgW, vpH, c);
    renderFG(setupCanvas(fgC, fgW, vpH), fgW, vpH, c);
  }

  /* ── transforms ── */
  function applyTransforms() {
    var ids = ['bg', 'mg', 'fg'];
    for (var k = 0; k < ids.length; k++) {
      var id = ids[k];
      var s = 1 + (zoom - 1) * ZR[id];
      var tx = vpW / 2 * (1 - s) - s * panX * SX[id];
      var ty = vpH / 2 * (1 - s) - s * panY * SY[id];
      canvases[id].style.transform =
        'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + s + ')';
    }
  }

  /* ── clamping ── */
  function clampState() {
    var fgZ = 1 + (tgtZ - 1) * ZR.fg;
    var mxX = vpW * (WORLD - 1 / fgZ);
    tgtX = Math.max(0, Math.min(mxX, tgtX));
    var mxY = vpH * 0.35;
    tgtY = Math.max(-mxY, Math.min(mxY, tgtY));
    tgtZ = Math.max(MINZ, Math.min(MAXZ, tgtZ));
  }

  /* ── helpers ── */
  function hideHint() {
    if (hintShown) { hint.classList.add('faded'); hintShown = false; }
  }
  function showZoom() {
    zbadge.textContent = zoom.toFixed(1) + '×';
    zbadge.classList.add('on');
    clearTimeout(zoomFadeTimer);
    zoomFadeTimer = setTimeout(function () { zbadge.classList.remove('on'); }, 1200);
  }

  /* ── pointer interaction (drag + pinch) ── */
  function onDown(e) {
    e.preventDefault();
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    vp.setPointerCapture(e.pointerId);

    if (ptrs.size === 1) {
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
      lastT = performance.now();
      velX = 0; velY = 0;
      document.body.classList.add('dragging');
    } else if (ptrs.size >= 2) {
      dragging = false; pinching = true;
      var arr = Array.from(ptrs.values());
      pinchDist = Math.hypot(arr[1].x - arr[0].x, arr[1].y - arr[0].y) || 1;
      pinchMid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
    }
    hideHint();
  }

  function onMove(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinching && ptrs.size >= 2) {
      var arr = Array.from(ptrs.values());
      var dist = Math.hypot(arr[1].x - arr[0].x, arr[1].y - arr[0].y) || 1;
      var mid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };

      var fgZ = 1 + (tgtZ - 1) * ZR.fg;
      tgtX += (pinchMid.x - mid.x) / (fgZ * SX.fg);
      tgtY += (pinchMid.y - mid.y) / (fgZ * SY.fg);

      var oldZ = tgtZ;
      tgtZ = Math.max(MINZ, Math.min(MAXZ, tgtZ * (dist / pinchDist)));
      tgtX += (mid.x - vpW / 2) * (1 / oldZ - 1 / tgtZ) / SX.fg;
      tgtY += (mid.y - vpH / 2) * (1 / oldZ - 1 / tgtZ) / SY.fg;

      clampState();
      pinchDist = dist;
      pinchMid = mid;
      showZoom();
      return;
    }

    if (dragging && ptrs.size === 1) {
      var x = e.clientX, y = e.clientY;
      var dx = lastX - x, dy = lastY - y;
      var now = performance.now(), dt = now - lastT;
      var fgZ = 1 + (tgtZ - 1) * ZR.fg;
      if (dt > 0) {
        velX = (dx / (fgZ * SX.fg)) / dt * 16;
        velY = (dy / (fgZ * SY.fg)) / dt * 16;
      }
      tgtX += dx / (fgZ * SX.fg);
      tgtY += dy / (fgZ * SY.fg);
      clampState();
      lastX = x; lastY = y; lastT = now;
    }
  }

  function onUp(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinching = false;
    if (ptrs.size === 0) {
      dragging = false;
      document.body.classList.remove('dragging');
    } else if (ptrs.size === 1 && !pinching) {
      dragging = true;
      var p = Array.from(ptrs.values())[0];
      lastX = p.x; lastY = p.y;
      lastT = performance.now();
      velX = 0; velY = 0;
    }
  }

  /* ── wheel zoom ── */
  function onWheel(e) {
    e.preventDefault();
    var factor = e.deltaY > 0 ? 0.94 : 1.06;
    var oldZ = tgtZ;
    tgtZ = Math.max(MINZ, Math.min(MAXZ, tgtZ * factor));
    tgtX += (e.clientX - vpW / 2) * (1 / oldZ - 1 / tgtZ) / SX.fg;
    tgtY += (e.clientY - vpH / 2) * (1 / oldZ - 1 / tgtZ) / SY.fg;
    clampState();
    hideHint();
    showZoom();
  }

  /* ── keyboard ── */
  function onKey(e) {
    var step = 40 / tgtZ;
    var fgZ = 1 + (tgtZ - 1) * ZR.fg;
    var handled = true;
    switch (e.key) {
      case 'ArrowLeft':  tgtX -= step / SX.fg; break;
      case 'ArrowRight': tgtX += step / SX.fg; break;
      case 'ArrowUp':    tgtY -= step / SY.fg; break;
      case 'ArrowDown':  tgtY += step / SY.fg; break;
      case '+': case '=':
        var oldZ = tgtZ; tgtZ = Math.min(MAXZ, tgtZ * 1.15); showZoom(); break;
      case '-': case '_':
        var oldZ = tgtZ; tgtZ = Math.max(MINZ, tgtZ * 0.87); showZoom(); break;
      default: handled = false;
    }
    if (handled) { e.preventDefault(); clampState(); hideHint(); }
  }

  /* ── event listeners ── */
  vp.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  vp.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('keydown', onKey);

  /* ── animation loop ── */
  function tick() {
    if (!dragging && !pinching) {
      tgtX += velX; tgtY += velY;
      velX *= FRICTION; velY *= FRICTION;
      if (Math.abs(velX) < 0.05) velX = 0;
      if (Math.abs(velY) < 0.05) velY = 0;
      clampState();
    }
    panX += (tgtX - panX) * LERP;
    panY += (tgtY - panY) * LERP;
    zoom += (tgtZ - zoom) * LERP;
    applyTransforms();
    requestAnimationFrame(tick);
  }

  /* ── resize & theme ── */
  var rTimer;
  window.addEventListener('resize', function () {
    clearTimeout(rTimer);
    rTimer = setTimeout(function () {
      var rx = maxPanX > 0 ? panX / maxPanX : 0;
      var ry = panY, rz = zoom;
      build();
      tgtX = panX = rx * maxPanX;
      tgtY = panY = ry;
      tgtZ = zoom = rz;
      clampState();
      applyTransforms();
    }, 200);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', build);
  new MutationObserver(build).observe(document.documentElement,
    { attributes: true, attributeFilter: ['data-theme'] });

  /* ── init ── */
  build();
  tgtX = maxPanX * 0.25;
  panX = tgtX;
  applyTransforms();
  requestAnimationFrame(tick);
})();
</script>
