<title>Parallax Landscape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat&display=swap">
<style>
  :root {
    --paper: #080606;
    --ink-dark: #ece8dc;
    --ink-mid: #a8a090;
    --ink-light: #585048;
    --ink-wash: #2e2820;
    --ink-accent: #d08848;
  }
  body {
    margin: 0;
    background: var(--paper);
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  body.dragging { cursor: grabbing; }
  #viewport {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform;
    transform-origin: 0 0;
  }
  #bg { z-index: 1; }
  #mg { z-index: 2; }
  #fg { z-index: 3; }
  .hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Caveat', 'Segoe Print', cursive;
    font-size: 22px;
    color: var(--ink-light);
    opacity: 1;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .hint.faded { opacity: 0; }
  .zoom-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: 'Caveat', 'Segoe Print', cursive;
    font-size: 18px;
    color: var(--ink-wash);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .zoom-badge.on { opacity: 1; }
  .sel-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Caveat', 'Segoe Print', cursive;
    font-size: 20px;
    color: var(--ink-accent);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.4s ease;
    white-space: nowrap;
  }
  .sel-hint.on { opacity: 1; }
  #viewport::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.12);
  }
</style>

<div id="viewport">
  <canvas id="bg"></canvas>
  <canvas id="mg"></canvas>
  <canvas id="fg"></canvas>
  <div class="hint" id="hint">drag to pan &#183; scroll to zoom &#183; tap a cabin</div>
  <div class="zoom-badge" id="zbadge"></div>
  <div class="sel-hint" id="sel-hint">press esc to go back</div>
</div>

<script>
(function () {
  'use strict';

  var SX = { bg: 0.1, mg: 0.35, fg: 1.0 };
  var SY = { bg: 0.05, mg: 0.2, fg: 0.6 };
  var ZR = { bg: 0.3, mg: 0.6, fg: 1.0 };
  var WORLD = 3.2;
  var FRICTION = 0.93;
  var LERP = 0.12;
  var MINZ = 0.7, MAXZ = 3.0;
  var SEL_ZOOM = 2.5;

  var bgC = document.getElementById('bg');
  var mgC = document.getElementById('mg');
  var fgC = document.getElementById('fg');
  var hint = document.getElementById('hint');
  var zbadge = document.getElementById('zbadge');
  var selHintEl = document.getElementById('sel-hint');
  var vp = document.getElementById('viewport');
  var canvases = { bg: bgC, mg: mgC, fg: fgC };

  var vpW, vpH, maxPanX;
  var panX = 0, panY = 0, zoom = 1;
  var tgtX = 0, tgtY = 0, tgtZ = 1;
  var velX = 0, velY = 0;
  var dragging = false, pinching = false;
  var lastX = 0, lastY = 0, lastT = 0;
  var hintShown = true;
  var ptrs = new Map();
  var pinchDist = 0, pinchMid = { x: 0, y: 0 };
  var zoomFadeTimer = 0;

  var mgBuildings = [];
  var selectedBldg = null;
  var preSelState = null;
  var dragDist = 0;

  var _s = 0;
  function srand(v) { _s = v | 0; }
  function rand() {
    _s = (_s * 16807) % 2147483647;
    return (_s - 1) / 2147483646;
  }

  function frac(x) { return x - Math.floor(x); }
  function noise(x) {
    var xi = Math.floor(x), xf = x - xi;
    var t = xf * xf * (3 - 2 * xf);
    var a = frac(Math.sin(xi * 127.1) * 43758.5453);
    var b = frac(Math.sin((xi + 1) * 127.1) * 43758.5453);
    return a + (b - a) * t;
  }
  function fbm(x, oct) {
    var v = 0, amp = 1, freq = 1, sum = 0;
    for (var i = 0; i < oct; i++) {
      v += noise(x * freq) * amp; sum += amp;
      amp *= 0.5; freq *= 2.1;
    }
    return v / sum;
  }

  function getColors() {
    var s = getComputedStyle(document.documentElement);
    var g = function (k) { return s.getPropertyValue(k).trim(); };
    return { paper: g('--paper'), dark: g('--ink-dark'), mid: g('--ink-mid'),
             light: g('--ink-light'), wash: g('--ink-wash'), accent: g('--ink-accent') };
  }
  function hexRGBA(hex, a) {
    if (!hex || hex.charAt(0) !== '#') return 'rgba(0,0,0,' + a + ')';
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function screenToMG(sx, sy) {
    var s = 1 + (zoom - 1) * ZR.mg;
    var tx = vpW / 2 * (1 - s) - s * panX * SX.mg;
    var ty = vpH / 2 * (1 - s) - s * panY * SY.mg;
    return { x: (sx - tx) / s, y: (sy - ty) / s };
  }
  function hitTestBuildings(cx, cy) {
    for (var i = mgBuildings.length - 1; i >= 0; i--) {
      var b = mgBuildings[i];
      if (cx >= b.left && cx <= b.right && cy >= b.top && cy <= b.bottom) return i;
    }
    return -1;
  }
  function hitTestAtScreen(sx, sy) {
    var p = screenToMG(sx, sy);
    return hitTestBuildings(p.x, p.y);
  }

  /* ── drawing primitives ── */
  function wLine(ctx, x1, y1, x2, y2, w) {
    w = w || 1.2;
    var d = Math.hypot(x2 - x1, y2 - y1);
    var segs = Math.max(Math.floor(d / 6), 3);
    ctx.beginPath();
    ctx.moveTo(x1 + (rand() - 0.5) * w, y1 + (rand() - 0.5) * w);
    for (var i = 1; i <= segs; i++) {
      var t = i / segs;
      ctx.lineTo(x1 + (x2 - x1) * t + (rand() - 0.5) * w,
                 y1 + (y2 - y1) * t + (rand() - 0.5) * w);
    }
    ctx.stroke();
  }
  function wPath(ctx, pts, w) {
    if (pts.length < 2) return;
    w = w || 1.2;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] + (rand() - 0.5) * w, pts[0][1] + (rand() - 0.5) * w);
    for (var i = 1; i < pts.length; i++)
      ctx.lineTo(pts[i][0] + (rand() - 0.5) * w, pts[i][1] + (rand() - 0.5) * w);
    ctx.stroke();
  }
  function scribOval(ctx, cx, cy, rx, ry) {
    var n = 14 + Math.floor(rand() * 6);
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2;
      var px = cx + Math.cos(a) * rx * (0.85 + rand() * 0.3) + (rand() - 0.5) * 1.5;
      var py = cy + Math.sin(a) * ry * (0.85 + rand() * 0.3) + (rand() - 0.5) * 1.5;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }

  /* ── mountain profile ── */
  function mountainY(xn) {
    var g = function (x, cx, sig) {
      var d = (x - cx) / sig; return Math.exp(-d * d);
    };
    return g(xn, 0.20, 0.10) * 0.42
         + g(xn, 0.38, 0.12) * 0.16
         + g(xn, 0.58, 0.14) * 0.07
         + g(xn, 0.78, 0.10) * 0.04;
  }
  function secondRidgeY(xn) {
    var g = function (x, cx, sig) {
      var d = (x - cx) / sig; return Math.exp(-d * d);
    };
    return g(xn, 0.32, 0.16) * 0.12
         + g(xn, 0.55, 0.13) * 0.07
         + g(xn, 0.80, 0.11) * 0.05;
  }

  /* ── terrain helpers ── */
  function mgTerrY(x, h) {
    return h * 0.58 + Math.sin(x * 0.006) * h * 0.02
      + Math.sin(x * 0.002) * h * 0.012
      + (fbm(x * 0.004 + 15, 3) - 0.5) * h * 0.025;
  }
  function fgTerrY(x, h) {
    return h * 0.74 + Math.sin(x * 0.01) * h * 0.015
      + Math.sin(x * 0.003) * h * 0.008
      + (fbm(x * 0.006 + 40, 3) - 0.5) * h * 0.02;
  }
  function makeTerrain(fn, w, h, step) {
    var pts = [];
    srand(_s);
    for (var x = -5; x <= w + 5; x += step) {
      var y = fn(x, h) + (rand() - 0.5) * 1.2;
      pts.push([x, y]);
    }
    return pts;
  }
  function fillBelow(ctx, pts, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineTo(w + 10, h + 10);
    ctx.lineTo(-10, h + 10);
    ctx.closePath();
    ctx.fill();
  }
  function strokeTerrain(ctx, pts, color, lw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  /* ── landscape elements ── */
  function drawConifer(ctx, x, y, h) {
    var tw = h * 0.3;
    wLine(ctx, x, y, x + (rand() - 0.5) * 1.5, y - h * 0.2, 1);
    var layers = 3 + Math.floor(rand() * 2);
    for (var i = 0; i < layers; i++) {
      var ty = y - h * (0.18 + i * 0.2);
      var s = tw * (1 - i * 0.15);
      wPath(ctx, [
        [x - s, ty + h * 0.15],
        [x + (rand() - 0.5) * 2, ty],
        [x + s, ty + h * 0.15]
      ], 1.0);
    }
  }

  function drawDecid(ctx, x, y, h) {
    wLine(ctx, x, y, x + (rand() - 0.5) * 3, y - h * 0.38, 1.3);
    var cy = y - h * 0.62, r = h * 0.25;
    var n = 2 + Math.floor(rand() * 2);
    for (var i = 0; i < n; i++)
      scribOval(ctx, x + (rand() - 0.5) * r * 0.6, cy + (rand() - 0.5) * r * 0.4,
        r * (0.6 + rand() * 0.4), r * (0.5 + rand() * 0.35));
  }

  function drawLargeTree(ctx, x, y, h) {
    var lean = (rand() - 0.5) * 5;
    wLine(ctx, x, y, x + lean, y - h * 0.35, 1.8);
    var brY = y - h * 0.3;
    wLine(ctx, x + lean * 0.8, brY, x + lean - h * 0.12, brY - h * 0.12, 1.0);
    wLine(ctx, x + lean * 0.8, brY, x + lean + h * 0.10, brY - h * 0.15, 1.0);
    var cy = y - h * 0.6;
    var n = 3 + Math.floor(rand() * 3);
    for (var i = 0; i < n; i++) {
      var ox = x + lean + (rand() - 0.5) * h * 0.28;
      var oy = cy + (rand() - 0.5) * h * 0.18;
      scribOval(ctx, ox, oy, h * (0.1 + rand() * 0.1), h * (0.08 + rand() * 0.08));
    }
  }

  function drawCabin(ctx, x, y, bw, bh) {
    wPath(ctx, [[x, y], [x, y - bh], [x + bw, y - bh], [x + bw, y]], 1.0);
    wLine(ctx, x, y, x + bw, y, 1.0);
    var roofH = bh * 0.35;
    wPath(ctx, [
      [x - bw * 0.06, y - bh],
      [x + bw * 0.5 + (rand() - 0.5) * 1.5, y - bh - roofH],
      [x + bw * 1.06, y - bh]
    ], 1.0);
    if (bw > 10) {
      var wx = x + bw * 0.35, wy = y - bh * 0.55, ww = bw * 0.22, wh = bh * 0.22;
      wLine(ctx, wx, wy, wx + ww, wy, 0.7);
      wLine(ctx, wx, wy + wh, wx + ww, wy + wh, 0.7);
      wLine(ctx, wx, wy, wx, wy + wh, 0.7);
      wLine(ctx, wx + ww, wy, wx + ww, wy + wh, 0.7);
    }
  }

  function drawPole(ctx, x, y, h) {
    wLine(ctx, x, y, x + (rand() - 0.5) * 0.8, y - h, 0.8);
    wLine(ctx, x - h * 0.12, y - h * 0.93, x + h * 0.12, y - h * 0.93, 0.8);
    if (rand() > 0.4) {
      wLine(ctx, x - h * 0.08, y - h * 0.85, x + h * 0.08, y - h * 0.85, 0.6);
    }
  }
  function drawWire(ctx, x1, y1, x2, y2) {
    var pts = [];
    for (var i = 0; i <= 10; i++) {
      var t = i / 10;
      var sag = Math.sin(t * Math.PI) * 5;
      pts.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t + sag + (rand() - 0.5) * 0.5]);
    }
    wPath(ctx, pts, 0.3);
  }

  function drawDenseBush(ctx, x, y, bw, bh) {
    var n = 4 + Math.floor(rand() * 5);
    for (var i = 0; i < n; i++) {
      var ox = x + (rand() - 0.5) * bw * 0.7;
      var oy = y - bh * (0.15 + rand() * 0.55);
      scribOval(ctx, ox, oy, bw * (0.12 + rand() * 0.18), bh * (0.1 + rand() * 0.16));
    }
  }

  function drawGrass(ctx, x, y, h) {
    var lean = (rand() - 0.5) * 6;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + lean * 0.5, y - h * 0.5, x + lean, y - h);
    ctx.stroke();
  }

  function drawRock(ctx, x, y, rw, rh) {
    scribOval(ctx, x, y - rh * 0.45, rw * 0.5, rh * 0.45);
    if (rw > 18) {
      ctx.lineWidth *= 0.6;
      wLine(ctx, x - rw * 0.15, y - rh * 0.5, x + rw * 0.08, y - rh * 0.35, 0.5);
      ctx.lineWidth /= 0.6;
    }
  }

  function drawLeafCluster(ctx, x, y) {
    var n = 3 + Math.floor(rand() * 3);
    for (var i = 0; i < n; i++) {
      var sl = 10 + rand() * 18, ang = -Math.PI / 2 + (rand() - 0.5) * 0.8;
      var tx = x + Math.cos(ang) * sl + (rand() - 0.5) * 4;
      var ty = y + Math.sin(ang) * sl;
      ctx.beginPath(); ctx.moveTo(x + (rand() - 0.5) * 2, y);
      ctx.quadraticCurveTo((x + tx) / 2 + (rand() - 0.5) * 3, (y + ty) / 2, tx, ty);
      ctx.stroke();
      var ll = 5 + rand() * 7, la = ang + (rand() - 0.5) * 0.4;
      var ltx = tx + Math.cos(la) * ll, lty = ty + Math.sin(la) * ll;
      var perp = la + Math.PI / 2, bulge = ll * 0.3;
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo((tx + ltx) / 2 + Math.cos(perp) * bulge,
        (ty + lty) / 2 + Math.sin(perp) * bulge, ltx, lty);
      ctx.quadraticCurveTo((tx + ltx) / 2 - Math.cos(perp) * bulge,
        (ty + lty) / 2 - Math.sin(perp) * bulge, tx, ty);
      ctx.stroke();
    }
  }

  /* ── selection overlay ── */
  function drawSelection(ctx, w, h, c) {
    if (selectedBldg === null || selectedBldg >= mgBuildings.length) return;
    var b = mgBuildings[selectedBldg];
    var accent = c.accent;
    var rx = (b.right - b.left) / 2 + 14;
    var ry = (b.bottom - b.top) / 2 + 14;
    ctx.save();
    ctx.fillStyle = hexRGBA(accent, 0.1);
    ctx.beginPath();
    ctx.ellipse(b.cx, b.cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.8;
    srand(9999);
    scribOval(ctx, b.cx, b.cy, rx - 2, ry - 2);
    ctx.lineWidth = 1.2;
    srand(9998);
    scribOval(ctx, b.cx, b.cy, rx + 3, ry + 3);
    var px = b.cx, py = b.top - 18;
    var pinR = 7;
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(px, py - pinR, pinR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px - pinR * 0.55, py - pinR * 0.25);
    ctx.lineTo(px, py + pinR * 0.9);
    ctx.lineTo(px + pinR * 0.55, py - pinR * 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = c.paper;
    ctx.beginPath();
    ctx.arc(px, py - pinR, pinR * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ── layer renderers ── */
  function renderBG(ctx, w, h, c) {
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    srand(100);

    ctx.strokeStyle = c.light;
    ctx.lineWidth = 0.9;
    var pts = [];
    for (var x = -10; x <= w + 10; x += 3) {
      var xn = x / w;
      var y = h * 0.56 - mountainY(xn) * h;
      y += (fbm(x * 0.015 + 5, 3) - 0.5) * h * 0.012;
      pts.push([x, y]);
    }
    wPath(ctx, pts, 0.7);

    ctx.strokeStyle = hexRGBA(c.light, 0.55);
    ctx.lineWidth = 0.7;
    srand(120);
    pts = [];
    for (var x = -10; x <= w + 10; x += 3) {
      var xn = x / w;
      var y = h * 0.54 - secondRidgeY(xn) * h;
      y += (fbm(x * 0.02 + 20, 2) - 0.5) * h * 0.008;
      pts.push([x, y]);
    }
    wPath(ctx, pts, 0.5);

    ctx.strokeStyle = hexRGBA(c.wash, 0.6);
    ctx.lineWidth = 0.5;
    srand(140);
    pts = [];
    for (var x = -5; x <= w + 5; x += 3) {
      var y = h * 0.56 + Math.sin(x * 0.005) * h * 0.015
        + (fbm(x * 0.008 + 35, 2) - 0.5) * h * 0.012;
      pts.push([x, y]);
    }
    wPath(ctx, pts, 0.4);

    srand(160);
    ctx.strokeStyle = hexRGBA(c.wash, 0.25);
    ctx.lineWidth = 0.3;
    for (var x = 0; x < w; x += 5 + rand() * 10) {
      var xn = x / w;
      var base = h * 0.56 - mountainY(xn) * h;
      var ground = h * 0.56;
      if (ground - base > h * 0.08) {
        var hy = base + (ground - base) * (0.4 + rand() * 0.4);
        wLine(ctx, x - 3, hy, x + 3, hy, 0.2);
      }
    }
  }

  function renderMG(ctx, w, h, c) {
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    mgBuildings = [];
    srand(300);

    var terr = makeTerrain(mgTerrY, w, h, 3);
    fillBelow(ctx, terr, w, h, c.paper);
    strokeTerrain(ctx, terr, c.mid, 1.2);

    ctx.strokeStyle = hexRGBA(c.mid, 0.3);
    ctx.lineWidth = 0.4;
    srand(320);
    var fieldZones = [
      { a: w * 0.18, b: w * 0.35 },
      { a: w * 0.52, b: w * 0.68 }
    ];
    for (var zi = 0; zi < fieldZones.length; zi++) {
      var z = fieldZones[zi];
      for (var y = h * 0.60; y < h * 0.70; y += 4 + rand() * 3) {
        var pts = [];
        for (var x = z.a; x < z.b; x += 7)
          pts.push([x + (rand() - 0.5) * 1.5, y + Math.sin(x * 0.015) * 1.5 + (rand() - 0.5)]);
        if (pts.length > 1) wPath(ctx, pts, 0.3);
      }
    }

    ctx.strokeStyle = c.mid; ctx.lineWidth = 1.0; srand(400);
    var treeZones = [
      { a: w * 0.01, b: w * 0.14, n: 6 },
      { a: w * 0.36, b: w * 0.50, n: 5 },
      { a: w * 0.70, b: w * 0.88, n: 7 },
      { a: w * 0.90, b: w * 1.0, n: 4 }
    ];
    for (var zi = 0; zi < treeZones.length; zi++) {
      var z = treeZones[zi];
      for (var i = 0; i < z.n; i++) {
        var x = z.a + rand() * (z.b - z.a);
        var by = mgTerrY(x, h);
        var th = 22 + rand() * 28;
        if (rand() > 0.45)
          drawDecid(ctx, x, by, th);
        else
          drawConifer(ctx, x, by, th);
      }
    }
    srand(440);
    for (var i = 0; i < Math.floor(w / 140); i++) {
      var x = rand() * w, by = mgTerrY(x, h), th = 18 + rand() * 22;
      rand() > 0.5 ? drawDecid(ctx, x, by, th) : drawConifer(ctx, x, by, th);
    }

    ctx.strokeStyle = c.mid; ctx.lineWidth = 1.0; srand(500);
    var cabinZones = [
      { a: w * 0.15, b: w * 0.30, n: 3 },
      { a: w * 0.55, b: w * 0.68, n: 2 },
      { a: w * 0.82, b: w * 0.92, n: 2 }
    ];
    for (var zi = 0; zi < cabinZones.length; zi++) {
      var cz = cabinZones[zi];
      for (var i = 0; i < cz.n; i++) {
        var x = cz.a + rand() * (cz.b - cz.a);
        var by = mgTerrY(x, h);
        var bw = 10 + rand() * 10;
        var bh = 10 + rand() * 8;
        mgBuildings.push({
          left: x - 4, top: by - bh * 1.4, right: x + bw + 4, bottom: by + 4,
          cx: x + bw / 2, cy: by - bh * 0.5
        });
        drawCabin(ctx, x, by, bw, bh);
      }
    }

    ctx.strokeStyle = c.mid; ctx.lineWidth = 0.8; srand(550);
    var poles = [];
    for (var x = w * 0.12; x < w * 0.65; x += 55 + rand() * 35) {
      var by = mgTerrY(x, h);
      var ph = 24 + rand() * 10;
      drawPole(ctx, x, by, ph);
      poles.push({ x: x, y: by - ph * 0.93 });
    }
    ctx.strokeStyle = hexRGBA(c.mid, 0.4);
    ctx.lineWidth = 0.3;
    for (var i = 0; i < poles.length - 1; i++) {
      drawWire(ctx, poles[i].x + 5, poles[i].y, poles[i + 1].x - 5, poles[i + 1].y);
    }

    ctx.strokeStyle = c.mid; ctx.lineWidth = 0.8; srand(580);
    var pts = [], pts2 = [];
    for (var x = w * 0.08; x < w * 0.70; x += 5) {
      var by = h * 0.65 + Math.sin(x * 0.004) * h * 0.015;
      pts.push([x, by - 2.5]); pts2.push([x, by + 2.5]);
    }
    wPath(ctx, pts, 0.6); wPath(ctx, pts2, 0.6);
  }

  function renderFG(ctx, w, h, c) {
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    srand(700);

    var terr = makeTerrain(fgTerrY, w, h, 3);
    fillBelow(ctx, terr, w, h, c.paper);

    ctx.strokeStyle = hexRGBA(c.dark, 0.2);
    ctx.lineWidth = 0.4;
    srand(710);
    for (var i = 0; i < Math.floor(w / 20); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      var len = 8 + rand() * 14;
      wLine(ctx, x, by + 2 + rand() * 5, x + len, by + 2 + rand() * 5, 0.4);
    }

    strokeTerrain(ctx, terr, c.dark, 1.6);

    ctx.strokeStyle = c.dark; ctx.lineWidth = 1.4; srand(730);
    for (var i = 0; i < Math.floor(w / 200); i++) {
      var x = w * 0.05 + rand() * w * 0.9;
      var by = fgTerrY(x, h);
      drawLargeTree(ctx, x, by, 55 + rand() * 40);
    }

    ctx.strokeStyle = c.dark; ctx.lineWidth = 1.3; srand(760);
    for (var i = 0; i < Math.floor(w / 75); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawDenseBush(ctx, x, by, 30 + rand() * 35, 22 + rand() * 28);
    }

    ctx.lineWidth = 1.2; srand(790);
    for (var i = 0; i < Math.floor(w / 100); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawDecid(ctx, x, by, 30 + rand() * 30);
    }

    ctx.lineWidth = 1.1; srand(820);
    for (var i = 0; i < Math.floor(w / 55); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawLeafCluster(ctx, x, by);
    }

    ctx.lineWidth = 0.8; srand(860);
    for (var i = 0; i < Math.floor(w / 8); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawGrass(ctx, x, by, 10 + rand() * 22);
    }

    ctx.lineWidth = 1.0; srand(890);
    for (var i = 0; i < Math.floor(w / 350); i++) {
      var x = rand() * w, by = fgTerrY(x, h);
      drawRock(ctx, x, by, 18 + rand() * 25, 12 + rand() * 15);
    }
  }

  /* ── canvas setup ── */
  function setupCanvas(canvas, lw, lh) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = lw * dpr;
    canvas.height = lh * dpr;
    canvas.style.width = lw + 'px';
    canvas.style.height = lh + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return ctx;
  }

  function build() {
    selectedBldg = null;
    preSelState = null;
    selHintEl.classList.remove('on');
    vpW = window.innerWidth;
    vpH = window.innerHeight;
    maxPanX = vpW * (WORLD - 1);
    var c = getColors();
    var bgW = Math.ceil(vpW + maxPanX * SX.bg);
    var mgW = Math.ceil(vpW + maxPanX * SX.mg);
    var fgW = Math.ceil(vpW + maxPanX * SX.fg);
    renderBG(setupCanvas(bgC, bgW, vpH), bgW, vpH, c);
    var mgCtx = setupCanvas(mgC, mgW, vpH);
    renderMG(mgCtx, mgW, vpH, c);
    renderFG(setupCanvas(fgC, fgW, vpH), fgW, vpH, c);
  }

  function refreshMG() {
    var c = getColors();
    var w = Math.ceil(vpW + maxPanX * SX.mg);
    var ctx = setupCanvas(mgC, w, vpH);
    renderMG(ctx, w, vpH, c);
    if (selectedBldg !== null) drawSelection(ctx, w, vpH, c);
  }

  function selectBuilding(idx) {
    if (idx < 0 || idx >= mgBuildings.length) return;
    if (selectedBldg === null) {
      preSelState = { x: tgtX, y: tgtY, z: tgtZ };
    }
    selectedBldg = idx;
    var b = mgBuildings[idx];
    tgtZ = SEL_ZOOM;
    tgtX = (b.cx - vpW / 2) / SX.mg;
    tgtY = (b.cy - vpH / 2) / SY.mg;
    clampState();
    velX = 0; velY = 0;
    refreshMG();
    selHintEl.classList.add('on');
    hideHint();
    showZoom();
  }

  function deselectBuilding() {
    if (selectedBldg === null) return;
    selectedBldg = null;
    if (preSelState) {
      tgtX = preSelState.x;
      tgtY = preSelState.y;
      tgtZ = preSelState.z;
      preSelState = null;
      clampState();
    }
    velX = 0; velY = 0;
    refreshMG();
    selHintEl.classList.remove('on');
    showZoom();
  }

  /* ── transforms ── */
  function applyTransforms() {
    var ids = ['bg', 'mg', 'fg'];
    for (var k = 0; k < ids.length; k++) {
      var id = ids[k];
      var s = 1 + (zoom - 1) * ZR[id];
      var tx = vpW / 2 * (1 - s) - s * panX * SX[id];
      var ty = vpH / 2 * (1 - s) - s * panY * SY[id];
      canvases[id].style.transform =
        'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + s + ')';
    }
  }

  function clampState() {
    var fgZ = 1 + (tgtZ - 1) * ZR.fg;
    var mxX = vpW * (WORLD - 1 / fgZ);
    tgtX = Math.max(0, Math.min(mxX, tgtX));
    var mxY = vpH * 0.35;
    tgtY = Math.max(-mxY, Math.min(mxY, tgtY));
    tgtZ = Math.max(MINZ, Math.min(MAXZ, tgtZ));
  }

  function hideHint() {
    if (hintShown) { hint.classList.add('faded'); hintShown = false; }
  }
  function showZoom() {
    zbadge.textContent = zoom.toFixed(1) + '×';
    zbadge.classList.add('on');
    clearTimeout(zoomFadeTimer);
    zoomFadeTimer = setTimeout(function () { zbadge.classList.remove('on'); }, 1200);
  }

  /* ── pointer interaction ── */
  function onDown(e) {
    e.preventDefault();
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { vp.setPointerCapture(e.pointerId); } catch (_) {}
    dragDist = 0;

    if (ptrs.size === 1) {
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
      lastT = performance.now();
      velX = 0; velY = 0;
      document.body.classList.add('dragging');
      document.body.style.cursor = '';
    } else if (ptrs.size >= 2) {
      dragging = false; pinching = true;
      dragDist = 999;
      var arr = Array.from(ptrs.values());
      pinchDist = Math.hypot(arr[1].x - arr[0].x, arr[1].y - arr[0].y) || 1;
      pinchMid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
    }
    hideHint();
  }

  function onMove(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinching && ptrs.size >= 2) {
      var arr = Array.from(ptrs.values());
      var dist = Math.hypot(arr[1].x - arr[0].x, arr[1].y - arr[0].y) || 1;
      var mid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
      var fgZ = 1 + (tgtZ - 1) * ZR.fg;
      tgtX += (pinchMid.x - mid.x) / (fgZ * SX.fg);
      tgtY += (pinchMid.y - mid.y) / (fgZ * SY.fg);
      var oldZ = tgtZ;
      tgtZ = Math.max(MINZ, Math.min(MAXZ, tgtZ * (dist / pinchDist)));
      tgtX += (mid.x - vpW / 2) * (1 / oldZ - 1 / tgtZ) / SX.fg;
      tgtY += (mid.y - vpH / 2) * (1 / oldZ - 1 / tgtZ) / SY.fg;
      clampState();
      pinchDist = dist;
      pinchMid = mid;
      showZoom();
      return;
    }

    if (dragging && ptrs.size === 1) {
      var x = e.clientX, y = e.clientY;
      var dx = lastX - x, dy = lastY - y;
      dragDist += Math.abs(dx) + Math.abs(dy);
      var now = performance.now(), dt = now - lastT;
      var fgZ = 1 + (tgtZ - 1) * ZR.fg;
      if (dt > 0) {
        velX = (dx / (fgZ * SX.fg)) / dt * 16;
        velY = (dy / (fgZ * SY.fg)) / dt * 16;
      }
      tgtX += dx / (fgZ * SX.fg);
      tgtY += dy / (fgZ * SY.fg);
      clampState();
      lastX = x; lastY = y; lastT = now;
    }
  }

  function onUp(e) {
    var cx = e.clientX, cy = e.clientY;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinching = false;
    if (ptrs.size === 0) {
      dragging = false;
      document.body.classList.remove('dragging');
      document.body.style.cursor = '';
      if (dragDist < 8) {
        var hitIdx = hitTestAtScreen(cx, cy);
        if (hitIdx >= 0) {
          selectBuilding(hitIdx);
        } else if (selectedBldg !== null) {
          deselectBuilding();
        }
      }
    } else if (ptrs.size === 1 && !pinching) {
      dragging = true;
      var p = Array.from(ptrs.values())[0];
      lastX = p.x; lastY = p.y;
      lastT = performance.now();
      velX = 0; velY = 0;
    }
  }

  function onWheel(e) {
    e.preventDefault();
    var factor = e.deltaY > 0 ? 0.94 : 1.06;
    var oldZ = tgtZ;
    tgtZ = Math.max(MINZ, Math.min(MAXZ, tgtZ * factor));
    tgtX += (e.clientX - vpW / 2) * (1 / oldZ - 1 / tgtZ) / SX.fg;
    tgtY += (e.clientY - vpH / 2) * (1 / oldZ - 1 / tgtZ) / SY.fg;
    clampState();
    hideHint();
    showZoom();
  }

  function onKey(e) {
    var step = 40 / tgtZ;
    var handled = true;
    switch (e.key) {
      case 'ArrowLeft':  tgtX -= step / SX.fg; break;
      case 'ArrowRight': tgtX += step / SX.fg; break;
      case 'ArrowUp':    tgtY -= step / SY.fg; break;
      case 'ArrowDown':  tgtY += step / SY.fg; break;
      case '+': case '=':
        tgtZ = Math.min(MAXZ, tgtZ * 1.15); showZoom(); break;
      case '-': case '_':
        tgtZ = Math.max(MINZ, tgtZ * 0.87); showZoom(); break;
      case 'Escape':
        if (selectedBldg !== null) deselectBuilding(); break;
      default: handled = false;
    }
    if (handled) { e.preventDefault(); clampState(); hideHint(); }
  }

  function onHover(e) {
    if (dragging || pinching) return;
    var hit = hitTestAtScreen(e.clientX, e.clientY);
    document.body.style.cursor = hit >= 0 ? 'pointer' : '';
  }

  vp.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  vp.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('keydown', onKey);
  vp.addEventListener('mousemove', onHover);

  function tick() {
    if (!dragging && !pinching) {
      tgtX += velX; tgtY += velY;
      velX *= FRICTION; velY *= FRICTION;
      if (Math.abs(velX) < 0.05) velX = 0;
      if (Math.abs(velY) < 0.05) velY = 0;
      clampState();
    }
    panX += (tgtX - panX) * LERP;
    panY += (tgtY - panY) * LERP;
    zoom += (tgtZ - zoom) * LERP;
    applyTransforms();
    requestAnimationFrame(tick);
  }

  var rTimer;
  window.addEventListener('resize', function () {
    clearTimeout(rTimer);
    rTimer = setTimeout(function () {
      var rx = maxPanX > 0 ? panX / maxPanX : 0;
      var ry = panY, rz = zoom;
      build();
      tgtX = panX = rx * maxPanX;
      tgtY = panY = ry;
      tgtZ = zoom = rz;
      clampState();
      applyTransforms();
    }, 200);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', build);
  new MutationObserver(build).observe(document.documentElement,
    { attributes: true, attributeFilter: ['data-theme'] });

  build();
  tgtX = maxPanX * 0.15;
  panX = tgtX;
  applyTransforms();
  requestAnimationFrame(tick);
})();
</script>
